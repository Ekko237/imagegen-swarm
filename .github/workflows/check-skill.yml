name: Check skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate SKILL.md frontmatter
        run: node .github/check-frontmatter.mjs
      - name: Syntax-check scripts
        run: |
          set -euo pipefail
          for f in skills/imagegen-swarm/scripts/*.mjs; do
            node --check "$f"
          done
          python3 -m py_compile skills/imagegen-swarm/scripts/*.py
      - name: Install Pillow
        run: python3 -m pip install pillow
      - name: Reliability tests
        run: |
          # reliability.test.mjs also launches batch.mjs and gemini-image.mjs through symlinks
          node tests/reliability.test.mjs
          node tests/series.test.mjs
          # Pillow only: the optional CLIP backend is tested through its fallback
          node tests/series-consistency.test.mjs
          python3 tests/reliability_rename_test.py
